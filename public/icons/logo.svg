<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ea44f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#treeGradient)" filter="url(#softShadow)"/>
    
    <g transform="translate(50, 50)" fill="white">
      <rect x="-3" y="-20" width="6" height="40" rx="2" fill="white"/>
      
      <circle cx="-15" cy="-10" r="4" fill="white"/>
      <line x1="-3" y1="-10" x2="-11" y2="-10" stroke="white" stroke-width="3" stroke-linecap="round"/>
      
      <circle cx="15" cy="-10" r="4" fill="white"/>
      <line x1="3" y1="-10" x2="11" y2="-10" stroke="white" stroke-width="3" stroke-linecap="round"/>
      
      <circle cx="-15" cy="10" r="4" fill="white"/>
      <line x1="-3" y1="10" x2="-11" y2="10" stroke="white" stroke-width="3" stroke-linecap="round"/>
      
      <circle cx="15" cy="10" r="4" fill="white"/>
      <line x1="3" y1="10" x2="11" y2="10" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  
  <text x="130" y="75" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="600" fill="#24292f" letter-spacing="-0.5">
    Tree<tspan fill="#2ea44f">Pad</tspan>
  </text>
  
  <text x="130" y="95" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#6e7781" letter-spacing="0.5">
    GitHub File Tree
  </text>
</svg>
